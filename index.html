function generatePriceHistory(basePrice, seed) {
  const days = 30, history = [];
  let rng = seed;
  function rand() { rng = (rng * 9301 + 49297) % 233280; return rng / 233280; }
  for (let i = days - 1; i >= 0; i--) {
    const date = new Date(); date.setDate(date.getDate() - i);
    const point = { date: date.toISOString().slice(0, 10) };
    Object.keys(PLATFORMS).forEach((p, idx) => {
      const drift = (rand() - 0.5) * 0.08;
      const seasonal = Math.sin((i + idx * 5) / 4) * 0.03;
      point[p] = Math.round(basePrice * (1 + drift + seasonal) / 100) * 100;
    });
    history.push(point);
  }
  return history;
}

function makeListings(basePrice, seed) {
  let rng = seed;
  function rand() { rng = (rng * 9301 + 49297) % 233280; return rng / 233280; }
  return Object.keys(PLATFORMS).map(p => {
    const jitter = (rand() - 0.5) * 0.08;
    const price = Math.round(basePrice * (1 + jitter) / 100) * 100;
    const mrp = Math.round(basePrice * 1.12 / 100) * 100;
    const inStock = rand() > 0.1;
    return {
      platform: p, url: '#',
      price: inStock ? price : null,
      mrp,
      discount: inStock ? Math.round((mrp - price) / mrp * 100) : null,
      inStock,
      seller: PLATFORMS[p].label + ' Retail',
      rating: 3.7 + rand() * 0.9,
      reviews: Math.floor(800 + rand() * 11200),
    };
  });
}

const CATEGORY_PREFIX = { phones:'PHN', tvs:'TVS', 'washing-machines':'WSH', refrigerators:'RFG', acs:'ACS' };
function generateSku(category, index) {
  return `KQ-${CATEGORY_PREFIX[category] || 'PRD'}-${String(index + 1).padStart(4, '0')}`;
}

/* ---------- Exclude filter rules per category ----------
 * Each rule has a label and a `match(p)` function. If match returns true,
 * the product is EXCLUDED when that rule is active.
 */
const EXCLUDE_FILTERS = {
  phones: [
    { id:'mediatek',   label:'MediaTek chipsets',          match:p => /mediatek|dimensity|helio/i.test(p.specs.chipset || '') },
    { id:'exynos',     label:'Exynos chipsets',            match:p => /exynos/i.test(p.specs.chipset || '') },
    { id:'no-5g',      label:'Phones without 5G',          match:p => !p.specs.fiveG },
    { id:'small-batt', label:'Battery under 4500 mAh',     match:p => (p.specs.battery || 0) < 4500 },
    { id:'no-ip',      label:'No IP68 water resistance',   match:p => p.specs.ip !== 'IP68' },
    { id:'low-ram',    label:'Less than 8 GB RAM',         match:p => (p.specs.ram || 0) < 8 },
    { id:'no-wireless',label:'No wireless charging',       match:p => p.specs.wireless !== true },
  ],
  tvs: [
    { id:'not-4k',     label:'Sub-4K resolution',          match:p => !/2160|4K/i.test(p.specs.resolution || '') },
    { id:'60hz',       label:'60Hz panels',                match:p => (p.specs.refreshRate || 0) <= 60 },
    { id:'no-dolby',   label:'No Dolby Vision',            match:p => !/dolby/i.test(p.specs.hdr || '') },
    { id:'led-only',   label:'Standard LED only (no OLED/QLED)', match:p => !/oled|qled|mini/i.test(p.specs.panel || '') },
  ],
  'washing-machines': [
    { id:'top-load',   label:'Top-load machines',          match:p => /top load/i.test(p.specs.type || '') },
    { id:'semi-auto',  label:'Semi-automatic',             match:p => /semi/i.test(p.specs.type || '') },
    { id:'no-inverter',label:'No inverter motor',          match:p => !/inverter|direct drive/i.test(p.specs.motor || '') },
    { id:'low-star',   label:'Less than 5-star',           match:p => !/5/.test(p.specs.energy || '') },
  ],
  refrigerators: [
    { id:'single-door',label:'Single-door units',          match:p => /single door/i.test(p.specs.type || '') },
    { id:'direct-cool',label:'Direct cool (manual defrost)',match:p => /direct cool|manual/i.test((p.specs.defrost || '') + (p.specs.type || '')) },
    { id:'low-star-r', label:'Less than 4-star',           match:p => !/[45].star/i.test(p.specs.stars || '') },
  ],
  acs: [
    { id:'window-ac',  label:'Window ACs',                 match:p => /window/i.test(p.specs.type || '') },
    { id:'non-inverter',label:'Non-inverter / fixed-speed',match:p => !/inverter/i.test(p.specs.tech || '') },
    { id:'low-star-ac',label:'Less than 5-star',           match:p => !/5/.test(p.specs.stars || '') },
    { id:'low-iseer',  label:'ISEER below 4.5',            match:p => parseFloat(p.specs.iseer || '0') < 4.5 },
  ],
};

PRODUCTS.forEach((p, i) => {
  p.sku = generateSku(p.category, i);
  p.launchDate = LAUNCH_DATES[p.slug] || `${p.releaseYear}-06-15`;
  p.listings = makeListings(p.basePrice, (i + 1) * 13);
  p.priceHistory = generatePriceHistory(p.basePrice, (i + 1) * 17);
  const ratings = p.listings.filter(l => l.rating).map(l => l.rating);
  p.avgRating = ratings.reduce((a,b)=>a+b,0) / ratings.length;
  p.totalReviews = p.listings.reduce((s, l) => s + (l.reviews || 0), 0);
  const inStock = p.listings.filter(l => l.inStock && l.price);
  p.lowest = inStock.length ? inStock.reduce((a, b) => a.price < b.price ? a : b) : null;
});

CATEGORIES.forEach(c => {

function detectCategory(text) {
  const t = text.toLowerCase();
  if (/wash|clothes|laundry/.test(t)) return 'washing-machines';
  if (/fridge|refrig/.test(t)) return 'refrigerators';
  if (/\bac\b|air condition/.test(t)) return 'acs';
  if (/\btv\b|television|smart tv|oled/.test(t)) return 'tvs';
  if (/phone|mobile|iphone|samsung|gaming|camera/.test(t)) return 'phones';
  return 'phones';
}

function detectBudget(text) {
  const m = text.toLowerCase().match(/(?:under|below|less than|<)\s*[₹]?\s*(\d{1,4})\s*(?:k|000|,000)?/);
  if (!m) return null;
  let n = parseInt(m[1]);
  if (n < 1000) n *= 1000;
  return n;
}

function quickRecommend(message) {
  const m = message.toLowerCase();
  const category = detectCategory(message);
  const budget = detectBudget(message);
  let candidates = PRODUCTS.filter(p => p.category === category);

  if (budget) candidates = candidates.filter(p => p.lowest && p.lowest.price <= budget);

  // Tag scoring based on intent keywords
  const intentTags = [];
  if (/gaming|game|pubg|bgmi/.test(m))   intentTags.push('gaming','performance','5g');
  if (/camera|photo|portrait/.test(m))   intentTags.push('camera','video');
  if (/battery|long.?lasting/.test(m))   intentTags.push('battery');
  if (/budget|cheap|value/.test(m))      intentTags.push('value','budget');
  if (/premium|flagship/.test(m))        intentTags.push('premium','flagship');
  if (/design|stylish/.test(m))          intentTags.push('design','lifestyle');
  if (/large family|big family/.test(m)) intentTags.push('large-capacity');
  if (/inverter/.test(m))                intentTags.push('inverter');

  // Score each candidate from 0 to 10 based on requirement match
  candidates.forEach(p => {
    p._matchScore = computeMatchScore(p, { intentTags, budget, raw: m });
  });
  candidates.sort((a, b) => b._matchScore - a._matchScore);

  let intro;
  if (budget) intro = `Under ₹${budget.toLocaleString('en-IN')}, here's my research with a fit score for each:`;
  else if (intentTags.includes('gaming')) intro = `Researched the catalogue for gaming-first picks. Top 3 with how closely each matches:`;
  else if (intentTags.includes('camera')) intro = `Camera-first picks across the catalogue, scored on requirement fit:`;
  else if (intentTags.includes('battery')) intro = `Battery champions in this category, scored on fit:`;
  else intro = `Top-rated picks in our ${categoryName(category)} catalogue:`;

  state.lastQuery = { text: message, intentTags, budget, category };

  return {
    intro,
    recs: candidates.slice(0, 3).map(p => ({
      slug: p.slug, name: p.name, price: p.lowest?.price ?? null,
      pros: p.pros || [], cons: p.cons || [],
      reason: oneLineReason(p, intentTags),
      matchScore: p._matchScore,
    })),
    followUp: 'Scores out of 10. Want a deeper analysis with specific requirements? Start the guided research →',
  };
}

/**
 * Match score 0-10 based on:
 *  - tag matches with intent (up to 5 pts)
 *  - budget fit, the more comfortably under-budget, the better (up to 2.5 pts)
 *  - average rating boost (up to 1.5 pts)
 *  - tie-breaking small priors (1 pt)
 */
function computeMatchScore(product, ctx) {
  const { intentTags = [], budget, priorityTags = [], useCases = [] } = ctx;
  let score = 0;

  // Tag overlap: heaviest weight goes to direct intent tags
  const tagSources = [...new Set([...intentTags, ...priorityTags])];
  if (tagSources.length) {
    const matches = product.tags.filter(t => tagSources.includes(t)).length;
    score += Math.min(5, matches * 1.7);
  } else {
    score += 1.5; // neutral baseline when no specific intent
  }

  // Use-case soft match
  if (useCases.length) {
    const ucMatches = useCases.filter(uc =>
      product.tags.some(t => t.includes(uc.toLowerCase().split(' ')[0]))
    ).length;
    score += Math.min(1.5, ucMatches * 0.5);
  }

  // Budget fit
  if (budget && product.lowest?.price) {
    if (product.lowest.price > budget) score += 0;
    else {
      const headroom = (budget - product.lowest.price) / budget;
      score += Math.min(2.5, 1.5 + headroom * 4);
    }
  } else {
    score += 1;
  }

  // Rating boost
  score += Math.min(1.5, ((product.avgRating || 4.0) - 3.5) * 1.5);

  return Math.max(1, Math.min(10, Math.round(score * 10) / 10));
}

function categoryName(slug) {
  return CATEGORIES.find(c => c.slug === slug)?.name || slug;
}

function oneLineReason(product, intentTags) {
  if (intentTags.includes('gaming') && product.tags.includes('gaming')) return 'Built for gaming with high refresh display and flagship chip.';
  if (intentTags.includes('camera') && product.tags.includes('camera')) return 'Strongest camera system in this price band.';
  if (intentTags.includes('battery') && product.tags.includes('battery')) return 'Largest battery in the segment with fast charging.';
  return product.verdict?.split('.')[0] || 'Strong all-rounder.';
}

function wizardRecommend(answers) {
  const { category, budgetMax, priorities = [], useCases = [] } = answers;
  let candidates = PRODUCTS.filter(p => p.category === category);
  if (budgetMax) candidates = candidates.filter(p => p.lowest && p.lowest.price <= budgetMax);

  // Map priorities to product tags
  const priorityToTag = {
    'Performance': ['performance','gaming'], 'Battery': ['battery'],
    'Camera': ['camera','video'], 'Design': ['design','lifestyle','premium'],
    'Brand reputation': ['premium','flagship'], 'Service network': [],
    'Energy efficiency': ['5-star'], 'Smart features': ['ai','wifi','smart-tv'],
    'Value for money': ['value','budget'], 'Premium feel': ['premium','flagship'],
    'Large capacity': ['large-capacity'], 'Long warranty': [],
    'Picture quality': ['oled','premium','dolby-vision'],
    'Gaming features': ['gaming','120hz'],
    'Sound quality': ['premium'],
    'Quick wash': [],
    'Frost free': ['frost-free'],
    'Cooling speed': ['inverter'],
    'Quiet operation': [],
  };
  const priorityTags = priorities.flatMap(p => priorityToTag[p] || [p.toLowerCase()]);

  candidates.forEach(p => {
    p._matchScore = computeMatchScore(p, { intentTags: priorityTags, priorityTags, useCases, budget: budgetMax });
  });
  candidates.sort((a, b) => b._matchScore - a._matchScore);

  const top3 = candidates.slice(0, 3);
  const summary = buildWizardSummary(answers, top3);

  state.lastQuery = { fromWizard: true, ...answers, intentTags: priorityTags };

  return {
    intro: summary,
    recs: top3.map(p => ({
      slug: p.slug, name: p.name, price: p.lowest?.price ?? null,
      pros: p.pros || [], cons: p.cons || [],
      reason: matchReason(p, answers),
      matchScore: p._matchScore,
    })),
    followUp: 'Scores reflect how closely each match your stated requirements. Click any product to see full specs, prices and reviews.',
  };
}

function buildWizardSummary(a, top3) {
  if (top3.length === 0) return `Nothing in our ${categoryName(a.category)} catalogue matches all your filters. Try increasing the budget or removing a priority.`;
  const cat = categoryName(a.category).toLowerCase();
  const budget = a.budgetMax ? ` under ₹${a.budgetMax.toLocaleString('en-IN')}` : '';
  const priorityLine = a.priorities?.length ? ` prioritising ${a.priorities.slice(0, 3).join(', ').toLowerCase()}` : '';
  return `Researched ${top3.length} ${cat}${budget}${priorityLine}. Here's my top 3 with the why behind each pick.`;
}

function matchReason(p, answers) {
  const matches = [];
  if (answers.priorities?.includes('Battery') && p.tags.includes('battery')) matches.push('battery champion');
  if (answers.priorities?.includes('Camera') && p.tags.includes('camera')) matches.push('camera-first');
  if (answers.priorities?.includes('Performance') && p.tags.includes('performance')) matches.push('performance machine');
  if (answers.priorities?.includes('Design') && (p.tags.includes('design') || p.tags.includes('premium'))) matches.push('standout design');
  if (matches.length) return `Matches your priorities: ${matches.join(' + ')}.`;
  return p.verdict?.split('.')[0] || 'Strong all-rounder.';
}

/**
 * AI Deal Score: position the current lowest price within the 30-day price band
 * across all platforms. Returns a 1-10 score and a plain-language verdict.
 */
function computeDealScore(p) {
  const all = p.priceHistory.flatMap(h => Object.keys(PLATFORMS).map(k => h[k])).filter(Boolean);
  if (!all.length) return null;
  const lo = Math.min(...all);
  const hi = Math.max(...all);
  const current = p.lowest?.price ?? lo;
  if (hi === lo) return { score: 5, verdict: 'Price has been flat for 30 days.', tier: 'volt', lo, hi, current };
  const pos = Math.max(0, Math.min(1, (current - lo) / (hi - lo)));
  const score = Math.max(1, Math.min(10, Math.round((10 - pos * 9) * 10) / 10));
  let verdict, tier;
  if (score >= 8.5)      { verdict = 'Great time to buy. Price is near the 30-day low.'; tier = 'emerald'; }
  else if (score >= 7)   { verdict = 'Reasonable. Slightly above the recent low.';        tier = 'volt'; }
  else if (score >= 5)   { verdict = 'Lukewarm. Has been cheaper in the last month.';     tier = 'amber'; }
  else                   { verdict = 'Near the 30-day high. Wait for a drop if you can.'; tier = 'rose'; }
  return { score, verdict, tier, lo, hi, current };
}

/**
 * AI Review Summary: synthesised TL;DR from aggregated user reviews.
 * In the mock, we re-flavor the curated pros/cons in "buyers say" voice.
 */
function computeAiReviewSummary(p) {
  const praise = (p.pros || []).slice(0, 3);
  const complaints = (p.cons || []).slice(0, 2);
  // Sentiment: pros count vs cons, weighted by aggregate rating
  const sentimentScore = Math.round(((p.avgRating || 4) - 3) * 25 + (praise.length - complaints.length) * 5);
  const sentiment = Math.max(0, Math.min(100, sentimentScore + 60));
  return { praise, complaints, sentiment, totalReviews: p.totalReviews };
}

/**
 * AI Total Cost of Ownership over 5 years.
 * Only applies to appliances (TV, AC, washing machine, refrigerator).
 */
function computeTCO(p) {
  if (p.category === 'phones') return null;
  const purchase = p.lowest?.price ?? 0;
  let annualKwh = 0, usage = '';
  if (p.category === 'acs') {
    const tons = parseFloat(p.specs.capacity) || 1.5;
    const stars = parseInt((p.specs.stars || '').match(/\d/)?.[0]) || 3;
    annualKwh = Math.round(tons * 720 * Math.max(0.55, 1 - (stars - 3) * 0.10));
    usage = '6 hours a day, 6 months a year';
  } else if (p.category === 'refrigerators') {
    const stars = parseInt((p.specs.stars || '').match(/\d/)?.[0]) || 3;
    const liters = parseInt(p.specs.capacity) || 220;
    annualKwh = Math.round((liters / 100) * 330 * Math.max(0.55, 1 - (stars - 3) * 0.12));
    usage = '24x7 always on';
  } else if (p.category === 'washing-machines') {
    annualKwh = 220;
    usage = 'About 5 loads per week';
  } else if (p.category === 'tvs') {
    const inches = parseInt(p.specs.size) || 50;
    annualKwh = Math.round(inches * 4.5);
    usage = '4 hours a day';
  }
  const rate = 8; // INR per kWh, India urban average
  const annualCost = annualKwh * rate;
  const fiveYearTCO = purchase + annualCost * 5;
  return { purchase, annualKwh, annualCost, fiveYearTCO, usage, rate };
}

/**
 * Voice input via Web Speech API. No-op gracefully when unsupported.
 */
let _voltRecognition = null;
function getVoiceRecognition() {
  if (_voltRecognition) return _voltRecognition;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  _voltRecognition = new SR();
  _voltRecognition.lang = 'en-IN';
  _voltRecognition.continuous = false;
  _voltRecognition.interimResults = false;
  return _voltRecognition;
}

function toggleVoiceInput() {
  const rec = getVoiceRecognition();
  const btn = document.getElementById('voice-btn');
  if (!rec) {
    alert('Voice input is not supported in this browser. Try Chrome.');
    return;
  }
  const input = document.getElementById('volt-input');
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    if (input) {
      input.value = text;
      input.focus();
    }
  };
  const stopVisuals = () => {
    btn?.classList.remove('ring-2','ring-rose-400','animate-pulse');
    btn?.removeAttribute('data-listening');
  };
  rec.onerror = stopVisuals;
  rec.onend = stopVisuals;
  if (btn?.dataset.listening === '1') {
    rec.stop(); stopVisuals(); return;
  }
  rec.start();
  btn?.classList.add('ring-2','ring-rose-400','animate-pulse');
  if (btn) btn.dataset.listening = '1';
}

function avgUserRating(slug) {
  const list = getProductReviews(slug);
  if (!list.length) return null;
  return list.reduce((s, r) => s + r.rating, 0) / list.length;
}

/* ---- Volt chat conversation ---- */

function renderVoltConversation() {
  const conv = document.getElementById('volt-conversation');
  if (!conv) return;
  conv.innerHTML = state.voltMessages.map(m => {
    if (m.role === 'user') {
      return `<div class="mb-4 flex justify-end">
        <div class="max-w-[85%] rounded-2xl rounded-br-sm bg-ink-900 px-4 py-2.5 text-sm text-white">${escapeHtml(m.content)}</div>
      </div>`;
    }
    if (m.loading) {
      return `<div class="mb-5 flex items-center gap-2 text-ink-500">
        <div class="spinner"></div>
        <span class="text-sm">Volt is researching...</span>
      </div>`;
    }
    const recsHtml = (m.recs || []).map((r, i) => `
      <div class="card p-5">
        <div class="flex items-start justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="mb-0.5 flex items-center gap-2">
              <span class="text-[11px] font-semibold uppercase tracking-wider text-volt-600">Pick #${i+1}</span>
              ${r.matchScore != null ? renderScoreBadge(r.matchScore) : ''}
            </div>
            <a data-link href="#/product/${r.slug}" class="text-base font-semibold text-ink-900 hover:underline">${escapeHtml(r.name)}</a>
            <div class="mt-1 text-sm text-ink-500">${escapeHtml(r.reason)}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-sm font-semibold">${formatINR(r.price)}</div>
            <a data-link href="#/product/${r.slug}" class="text-[11px] text-volt-600 hover:underline">View →</a>
          </div>
        </div>
        ${r.pros?.length || r.cons?.length ? `
          <div class="mt-4 grid gap-3 sm:grid-cols-2">
            ${r.pros?.length ? `<div>
              <div class="mb-1 text-[11px] font-semibold uppercase tracking-wider text-emerald-700">Pros</div>
              <ul class="space-y-1 text-xs text-ink-700">
                ${r.pros.slice(0,4).map(p => `<li class="flex gap-1.5"><span class="text-emerald-600">✓</span>${escapeHtml(p)}</li>`).join('')}
              </ul>
            </div>` : ''}
            ${r.cons?.length ? `<div>
              <div class="mb-1 text-[11px] font-semibold uppercase tracking-wider text-rose-700">Cons</div>
              <ul class="space-y-1 text-xs text-ink-700">
                ${r.cons.slice(0,4).map(c => `<li class="flex gap-1.5"><span class="text-rose-500">×</span>${escapeHtml(c)}</li>`).join('')}
              </ul>
            </div>` : ''}
          </div>
        ` : ''}
      </div>
    `).join('');
    const refineChips = m.recs?.length ? buildRefinementChips(state.lastQuery) : [];
    const refineHtml = refineChips.length ? `
      <div class="mt-4 border-t border-ink-100 pt-3">
        <div class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-ink-500">Refine your search</div>
        <div class="flex flex-wrap gap-1.5">
          ${refineChips.map(c => `<button class="refine-chip chip" data-msg="${escapeHtml(c.msg)}">${escapeHtml(c.label)}</button>`).join('')}
        </div>
      </div>
    ` : '';
    return `<div class="mb-5">
      <div class="mb-2 flex items-center gap-2 text-xs font-medium uppercase tracking-wider text-volt-600">
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-3.5 w-3.5"><path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg> Volt
      </div>
      <p class="whitespace-pre-wrap text-sm leading-relaxed text-ink-800">${escapeHtml(m.content)}</p>
      ${recsHtml ? `<div class="mt-4 grid gap-3">${recsHtml}</div>` : ''}
      ${m.followUp ? `<p class="mt-4 text-sm text-ink-500">${escapeHtml(m.followUp)}</p>` : ''}
      ${refineHtml}
    </div>`;
  }).join('');
  conv.scrollTop = conv.scrollHeight;
  // Re-attach link handlers in dynamically rendered area
  conv.querySelectorAll('[data-link]').forEach(el => {
    el.addEventListener('click', (e) => {
      const href = el.getAttribute('href');
      if (href?.startsWith('#/')) { e.preventDefault(); navigate(href); window.scrollTo(0,0); }
    });
  });
  // Refine chips: send their msg as a follow-up query to Volt
  conv.querySelectorAll('.refine-chip').forEach(el => {
    el.addEventListener('click', () => sendToVolt(el.dataset.msg));
  });
}

function sendToVolt(text) {
  const message = text.trim();
  if (!message) return;
  state.voltMessages.push({ role: 'user', content: message });
  state.voltMessages.push({ role: 'assistant', loading: true });
  document.getElementById('volt-conversation')?.classList.remove('hidden');
  renderVoltConversation();
  setTimeout(() => {
    const result = quickRecommend(message);
    state.voltMessages.pop();
    state.voltMessages.push({ role: 'assistant', content: result.intro, recs: result.recs, followUp: result.followUp });
    renderVoltConversation();
  }, 900);
}

function renderWizardModal() {

  else if (step === 1) body = renderWizardStep1();

    </div>

function attachWizardEvents() {
  // Step 0
  document.querySelectorAll('.wizard-category').forEach(b => {
    b.addEventListener('click', () => {
      state.wizardAnswers.category = b.dataset.wizardCategory;
      state.wizardStep = 1;
      renderWizardModal();
    });
  });
  // Step 1
  document.querySelectorAll('.wizard-budget').forEach(b => {
    b.addEventListener('click', () => {
      state.wizardAnswers.budgetMax = parseInt(b.dataset.wizardBudget);
      state.wizardStep = 2;
      renderWizardModal();
    });
  });
  // Step 2
  document.querySelectorAll('.wizard-priority').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.wizardPriority;
      const arr = state.wizardAnswers.priorities;
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else if (arr.length < 3) arr.push(v);
      renderWizardModal();
    });
  });
  // Step 3
  document.querySelectorAll('.wizard-usecase').forEach(b => {
    b.addEventListener('click', () => {
      const v = b.dataset.wizardUsecase;
      const arr = state.wizardAnswers.useCases;
      const i = arr.indexOf(v);
      if (i >= 0) arr.splice(i, 1);
      else arr.push(v);
      renderWizardModal();
    });
  });
  // Step buttons (back/next/submit)
  const step = state.wizardStep;
  const isReady =
    (step === 0 && state.wizardAnswers.category) ||
    (step === 1 && state.wizardAnswers.budgetMax) ||
    (step === 2 && (state.wizardAnswers.priorities || []).length > 0) ||
    (step === 3);
  if (step >= 0 && step <= 3) {
    const root = document.getElementById('modal-root');
    const buttonsHtml = `
      <div class="mt-6 flex items-center justify-between border-t border-ink-100 pt-5">
        <button id="wizard-back" class="text-sm text-ink-500 hover:text-ink-900 ${step === 0 ? 'invisible' : ''}">← Back</button>
        <div class="flex gap-2">
          <button id="wizard-skip" class="text-sm text-ink-500 hover:text-ink-900 ${step >= 2 ? '' : 'hidden'}">Skip</button>
          <button id="wizard-next" class="btn-primary !py-2 !px-5 text-sm" ${isReady ? '' : 'disabled'}>${step === 3 ? 'Get my recommendations' : 'Next →'}</button>
        </div>
      </div>
    `;
    const content = root.querySelector('.modal-content > div:last-child');
    if (content && !content.querySelector('#wizard-back')) content.insertAdjacentHTML('beforeend', buttonsHtml);

    document.getElementById('wizard-back')?.addEventListener('click', () => {
      state.wizardStep = Math.max(0, step - 1);
      renderWizardModal();
    });
    document.getElementById('wizard-skip')?.addEventListener('click', () => {
      if (step < 3) { state.wizardStep = step + 1; renderWizardModal(); }
      else submitWizard();
    });
    document.getElementById('wizard-next')?.addEventListener('click', () => {
      if (step === 3) {
        state.wizardAnswers.notes = document.getElementById('wizard-notes')?.value || '';
        submitWizard();
      } else {
        state.wizardStep = step + 1;
        renderWizardModal();
      }
    });
  }
}

function submitWizard() {
  state.wizardStep = 4;
  renderWizardModal();
  setTimeout(() => {
    const result = wizardRecommend(state.wizardAnswers);
    closeModal();
    // Push the answers as a user message and the recs as Volt's reply
    const summaryParts = [
      `Researching ${categoryName(state.wizardAnswers.category)}`,
      state.wizardAnswers.budgetMax ? `under ₹${state.wizardAnswers.budgetMax.toLocaleString('en-IN')}` : null,
      state.wizardAnswers.priorities?.length ? `prioritising ${state.wizardAnswers.priorities.join(', ')}` : null,
    ].filter(Boolean);
    state.voltMessages.push({ role: 'user', content: summaryParts.join(', ') + '.' });
    state.voltMessages.push({ role: 'assistant', content: result.intro, recs: result.recs, followUp: result.followUp });
    if ((window.location.hash || '#/') !== '#/') navigate('#/');
    else { document.getElementById('volt-conversation')?.classList.remove('hidden'); renderVoltConversation(); }
  }, 1400);
}

    btn.addEventListener('click', () => {
      const { min, max } = JSON.parse(btn.dataset.price);
      if (state.filters.priceMin === min && state.filters.priceMax === max) {
        state.filters.priceMin = null; state.filters.priceMax = null;
      } else {
        state.filters.priceMin = min; state.filters.priceMax = max;
      }
      renderFilters(); renderProductGrid();
    });
  });
  document.querySelectorAll('.filter-exclude').forEach(cb => {
    cb.addEventListener('change', () => {
      const id = cb.dataset.exclude;
      const arr = state.filters.exclude || (state.filters.exclude = []);
      const idx = arr.indexOf(id);
      if (cb.checked && idx < 0) arr.push(id);
      else if (!cb.checked && idx >= 0) arr.splice(idx, 1);
      renderFilters(); renderProductGrid();
    });
  });
  document.getElementById('clear-filters')?.addEventListener('click', () => {
    state.filters = { brand:null, priceMin:null, priceMax:null, search:'', exclude:[] };
    renderFilters(); renderProductGrid();
  });
}

function filteredProducts() {
  const excludeRules = (EXCLUDE_FILTERS[currentCategory] || [])
    .filter(o => (state.filters.exclude || []).includes(o.id));
  return PRODUCTS.filter(p => p.category === currentCategory).filter(p => {
    if (state.filters.brand && p.brand !== state.filters.brand) return false;
    if (state.filters.search && !p.name.toLowerCase().includes(state.filters.search.toLowerCase())) return false;
    if (!p.lowest) return false;
    if (state.filters.priceMin !== null && p.lowest.price < state.filters.priceMin) return false;
    if (state.filters.priceMax !== null && p.lowest.price > state.filters.priceMax) return false;
    if (excludeRules.some(r => r.match(p))) return false;
    return true;
  });
}

function renderProductGrid() {
  const grid = document.getElementById('products-grid');
  if (!grid) return;
  const products = filteredProducts();
  if (products.length === 0) {
    grid.innerHTML = `<div class="rounded-xl border border-ink-100 bg-ink-50 p-10 text-center text-ink-500">No products match your filters.</div>`;
    return;
  }
  grid.innerHTML = `
    <div class="mb-4 text-sm text-ink-500">${products.length} products</div>
    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      ${products.map(p => {
        const inCompare = state.compareList.includes(p.slug);
        return `<div class="card group overflow-hidden p-5 transition hover:-translate-y-0.5 hover:shadow-soft">
          <a data-link href="#/product/${p.slug}" class="block">
            <div class="mb-4 grid aspect-square place-items-center overflow-hidden rounded-xl bg-ink-50">
              <img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" class="h-full w-full object-contain p-4 transition group-hover:scale-[1.03]" />

            <div class="text-xs uppercase tracking-wider text-ink-500">${escapeHtml(p.brand)}</div>
            <h3 class="mt-1 line-clamp-2 min-h-[44px] text-sm font-semibold leading-snug">${escapeHtml(p.name)}</h3>
            <div class="mt-3 flex items-baseline justify-between">

                <div class="text-base font-semibold">${formatINR(p.lowest?.price)}</div>
                <div class="text-[11px] text-ink-500">on ${PLATFORMS[p.lowest.platform].label}</div>
              </div>
              <div class="flex items-center gap-1 rounded-full bg-ink-50 px-2 py-1 text-xs font-medium text-ink-700">⭐ ${p.avgRating.toFixed(1)}</div>
            </div>
          </a>
          <button class="compare-toggle mt-3 w-full rounded-full border px-3 py-1.5 text-xs font-medium transition ${inCompare ? 'border-volt-500 bg-volt-50 text-volt-700' : 'border-ink-200 text-ink-700 hover:border-ink-400'}" data-slug="${p.slug}">
            ${inCompare ? '✓ In compare' : '+ Add to compare'}
          </button>
        </div>`;
      }).join('')}
    </div>
  `;
  grid.querySelectorAll('[data-link]').forEach(el => {
    el.addEventListener('click', (e) => {
      const href = el.getAttribute('href');
      if (href?.startsWith('#/')) { e.preventDefault(); navigate(href); window.scrollTo(0,0); }
    });
  });
  grid.querySelectorAll('.compare-toggle').forEach(b => {
    b.addEventListener('click', (e) => { e.stopPropagation(); toggleCompare(b.dataset.slug); });
  });
}

function specSections(p) {

      ['Display', [fmt('Size', s.display), fmt('Resolution', s.resolution), fmt('Refresh rate', s.refreshRate ? s.refreshRate + ' Hz' : null)].filter(Boolean)],

      ['Camera', [fmt('Rear', s.mainCamera), fmt('Front', s.frontCamera)].filter(Boolean)],
      ['Battery', [fmt('Capacity', s.battery ? s.battery + ' mAh' : null), fmt('Fast charging', s.charging ? s.charging + ' W' : null), fmt('Wireless', s.wireless == null ? null : (s.wireless ? 'Yes' : 'No'))].filter(Boolean)],
      ['Other', [fmt('OS', s.os), fmt('Weight', s.weight ? s.weight + ' g' : null), fmt('5G', s.fiveG == null ? null : (s.fiveG ? 'Yes' : 'No')), fmt('IP rating', s.ip)].filter(Boolean)],
    ];
  } else if (p.category === 'tvs') {
    return [
      ['Display', [fmt('Size', s.size), fmt('Resolution', s.resolution), fmt('Panel', s.panel), fmt('Refresh rate', s.refreshRate ? s.refreshRate + ' Hz' : null), fmt('HDR', s.hdr)].filter(Boolean)],
      ['Smart features', [fmt('OS', s.smartOs), fmt('Ports', s.ports)].filter(Boolean)],
      ['Audio & power', [fmt('Sound', s.sound), fmt('Energy rating', s.energy)].filter(Boolean)],
      ['Other', [fmt('Warranty', s.warranty)].filter(Boolean)],
    ];
  } else if (p.category === 'washing-machines') {
    return [
      ['Capacity & type', [fmt('Capacity', s.capacity), fmt('Type', s.type), fmt('Spin speed', s.spinSpeed)].filter(Boolean)],
      ['Tech', [fmt('Motor', s.motor), fmt('Energy rating', s.energy), fmt('Programs', s.programs), fmt('WiFi', s.wifi)].filter(Boolean)],
      ['Features', [fmt('Smart features', s.features)].filter(Boolean)],
      ['Warranty', [fmt('Warranty', s.warranty)].filter(Boolean)],
    ];
  } else if (p.category === 'refrigerators') {
    return [
      ['Capacity & type', [fmt('Capacity', s.capacity), fmt('Type', s.type), fmt('Defrost', s.defrost)].filter(Boolean)],
      ['Tech', [fmt('Compressor', s.compressor), fmt('Energy rating', s.stars)].filter(Boolean)],
      ['Features', [fmt('Smart features', s.features)].filter(Boolean)],
      ['Warranty', [fmt('Warranty', s.warranty)].filter(Boolean)],
    ];
  } else if (p.category === 'acs') {
    return [
      ['Capacity & type', [fmt('Capacity', s.capacity), fmt('Type', s.type), fmt('Tech', s.tech), fmt('Coil', s.coil)].filter(Boolean)],
      ['Performance', [fmt('Energy rating', s.stars), fmt('ISEER', s.iseer), fmt('Noise', s.noise)].filter(Boolean)],
      ['Features', [fmt('Smart features', s.features)].filter(Boolean)],
      ['Warranty', [fmt('Warranty', s.warranty)].filter(Boolean)],
    ];
  }
  return [];
}

function attachProductDetailEvents(slug) {
  document.getElementById('write-review-btn')?.addEventListener('click', () => {
    if (!state.currentUser) {
      openLoginModal('You need to sign in to write a review.', () => openReviewModal(slug));
    } else {
      openReviewModal(slug);
    }
  });
  document.getElementById('compare-detail-toggle')?.addEventListener('click', () => {
    toggleCompare(slug);
  });
  document.getElementById('alert-btn')?.addEventListener('click', () => {
    if (!state.currentUser) {
      openLoginModal('Sign in to track price drops and back-in-stock alerts.', () => openAlertModal(slug));
    } else {
      openAlertModal(slug);
    }
  });
  document.getElementById('share-product-btn')?.addEventListener('click', () => {
    const product = PRODUCTS.find(p => p.slug === slug);
    openShareModal('product', product);
  });
  document.getElementById('manage-alerts-btn')?.addEventListener('click', () => openAlertModal(slug));
}

/* =====================================================================
 * ALERTS — price threshold + back-in-stock notifications
 * ===================================================================== */

function alertsForUserAndProduct(slug) {
  if (!state.currentUser) return [];
  return state.alerts.filter(a => a.userEmail === state.currentUser.email && a.slug === slug);
}

function alertSummaryFor(slug) {
  const my = alertsForUserAndProduct(slug);
  if (!my.length) return '';
  return `
    <div class="mt-4 rounded-xl border border-volt-200 bg-volt-50 p-3 text-xs text-volt-700">
      <div class="flex items-center justify-between gap-3">
        <span>
          ${my.map(a => a.kind === 'price'
            ? `🔔 Notify when price drops below ${formatINR(a.threshold)}`
            : `🔔 Notify when back in stock on ${PLATFORMS[a.platform]?.label || 'any retailer'}`
          ).join(' · ')}
        </span>
        <button id="manage-alerts-btn" class="text-volt-600 underline hover:text-volt-700">Manage</button>
      </div>
    </div>
  `;
}

function openAlertModal(slug) {
  const product = PRODUCTS.find(p => p.slug === slug);
  if (!product) return;
  const lowest = product.lowest?.price ?? 0;
  const suggested = Math.round(lowest * 0.92 / 100) * 100;
  const my = alertsForUserAndProduct(slug);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-close"></div>
    <div class="modal-content card p-7">
      <div class="mb-5">
        <div class="text-[11px] font-semibold uppercase tracking-wider text-volt-600">Set an alert</div>
        <div class="text-base font-semibold">${escapeHtml(product.name)}</div>
        <p class="mt-1 text-xs text-ink-500">SKU ${escapeHtml(product.sku)} · current lowest ${formatINR(lowest)}</p>
      </div>

      <div class="space-y-4">
        <div class="card p-4">
          <div class="mb-2 text-sm font-semibold">📉 Notify me on price drop</div>
          <p class="mb-3 text-xs text-ink-500">We will email you when any retailer drops below your threshold.</p>
          <form id="alert-price-form" class="flex items-center gap-2">
            <span class="text-sm">₹</span>
            <input id="alert-threshold" type="number" min="0" step="100" value="${suggested}"
              class="w-full rounded-xl border border-ink-200 px-4 py-2 text-sm focus:border-ink-400 focus:outline-none" />
            <button type="submit" class="btn-primary !py-2 !px-4 text-sm">Set</button>
          </form>
        </div>

        <div class="card p-4">
          <div class="mb-2 text-sm font-semibold">📦 Notify me when back in stock</div>
          <p class="mb-3 text-xs text-ink-500">Pick a retailer to watch (or leave blank for any).</p>
          <form id="alert-stock-form" class="flex items-center gap-2">
            <select id="alert-platform" class="w-full rounded-xl border border-ink-200 px-4 py-2 text-sm focus:border-ink-400 focus:outline-none">
              <option value="">Any retailer</option>
              ${Object.entries(PLATFORMS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}
            </select>
            <button type="submit" class="btn-secondary !py-2 !px-4 text-sm">Set</button>
          </form>
        </div>

        ${my.length ? `
          <div>
            <div class="mb-2 text-xs font-semibold uppercase tracking-wider text-ink-500">Your alerts on this product</div>
            <ul class="space-y-1 text-sm">
              ${my.map(a => `
                <li class="flex items-center justify-between rounded-lg bg-ink-50 px-3 py-2">
                  <span>${a.kind === 'price'
                    ? `🔔 Below ${formatINR(a.threshold)}`
                    : `🔔 Back in stock on ${a.platform ? PLATFORMS[a.platform].label : 'any retailer'}`}</span>
                  <button class="alert-remove text-xs text-rose-600 hover:underline" data-id="${a.id}">Remove</button>
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}
      </div>
    </div>
  `;
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('alert-price-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const threshold = parseInt(document.getElementById('alert-threshold').value);
    if (!threshold) return;
    state.alerts.push({
      id: 'a' + Date.now() + Math.random().toString(36).slice(2,7),
      userEmail: state.currentUser.email, slug, kind: 'price', threshold,
      created: new Date().toISOString(),
    });
    persist.alerts(); closeModal(); render();
  });
  document.getElementById('alert-stock-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const platform = document.getElementById('alert-platform').value || null;
    state.alerts.push({
      id: 'a' + Date.now() + Math.random().toString(36).slice(2,7),
      userEmail: state.currentUser.email, slug, kind: 'stock', platform,
      created: new Date().toISOString(),
    });
    persist.alerts(); closeModal(); render();
  });
  root.querySelectorAll('.alert-remove').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.id;
      state.alerts = state.alerts.filter(a => a.id !== id);
      persist.alerts();
      openAlertModal(slug); // re-render the modal in place
    });
  });
}

function drawPriceChart(slug) {
  const p = PRODUCTS.find(x => x.slug === slug);
  const ctx = document.getElementById('price-chart');
  if (!ctx || !p) return;
  const labels = p.priceHistory.map(h => h.date.slice(5));
  const datasets = Object.keys(PLATFORMS).map(plat => ({
    label: PLATFORMS[plat].label,
    data: p.priceHistory.map(h => h[plat]),
    borderColor: PLATFORMS[plat].color,
    backgroundColor: PLATFORMS[plat].color + '20',
    borderWidth: 2, tension: 0.25, pointRadius: 0, pointHoverRadius: 4,
  }));
  new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 8, boxHeight: 8, font: { size: 12 } } },
        tooltip: { backgroundColor: 'white', titleColor: '#0d0d10', bodyColor: '#34343a',
          borderColor: '#eeeef0', borderWidth: 1, padding: 12,
          callbacks: { label: (c) => c.dataset.label + ': ' + formatINR(c.raw) } },
      },
      scales: {
        x: { grid: { color: '#f7f7f8' }, ticks: { font: { size: 10 }, color: '#65656c' } },
        y: { grid: { color: '#eeeef0' }, ticks: { callback: v => '₹' + (v/1000).toFixed(0) + 'k', color: '#65656c' } },
      },
    },
  });
}

function renderComparePage() {
  const items = state.compareList.map(s => PRODUCTS.find(p => p.slug === s)).filter(Boolean);
  if (items.length === 0) {
    return `<section class="container-tight py-20 text-center">
      <h1 class="font-display text-3xl font-semibold">Nothing to compare yet</h1>
      <p class="mt-3 text-ink-500">Add 2 to 3 products to compare from any product page.</p>
      <a data-link href="#/category/phones" class="btn-primary mt-6">Browse phones</a>
    </section>`;
  }

  const cat = items[0].category;
  const sectionRows = specSections(items[0]);

  // Build a per-platform listing lookup so we can render Amazon / Flipkart / etc rows neatly
  const listingByPlatform = (p) => Object.fromEntries(p.listings.map(l => [l.platform, l]));

  // Helper: highlight best/worst across columns for visual ranking
  const numericCell = (val, allVals, higherIsBetter = true) => {
    if (val == null || isNaN(val)) return `<td class="p-5 text-sm text-ink-400">-</td>`;
    const valid = allVals.filter(v => v != null && !isNaN(v));
    if (!valid.length) return `<td class="p-5 text-sm text-ink-700">${val}</td>`;
    const best = higherIsBetter ? Math.max(...valid) : Math.min(...valid);
    const isBest = val === best;
    return `<td class="p-5 text-sm ${isBest ? 'font-semibold text-emerald-700' : 'text-ink-700'}">${val}${isBest ? ' <span class="text-[10px] uppercase tracking-wider rounded bg-emerald-100 px-1.5 py-0.5">Best</span>' : ''}</td>`;
  };
